<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Housekeeper</title><link rel="stylesheet" href="css/neo.css"></head>
<body data-role="Housekeeper">
<header class="top"><h1>Housekeeper</h1><span class="role">Notices and room status</span></header>
<main><section id="summary" class="stats"></section>
<section class="panel"><h2>Housekeeping Notices</h2><div class="tw"><table><thead><tr><th>Room</th><th>Message</th><th>Sender</th><th>Date / Time</th><th>Notice</th><th>Room Status</th><th>Action</th></tr></thead>
<tbody id="nrows"><tr><td colspan="7" class="msg">Loading notices…</td></tr></tbody></table></div></section>
<section class="panel"><h2>Room Status and Availability</h2><div id="toolbar" class="bar"></div>
<div class="tw"><table><thead><tr><th>Room</th><th>Status</th><th>Availability</th><th>Last Updated</th></tr></thead>
<tbody id="rows"><tr><td colspan="4" class="msg">Loading rooms…</td></tr></tbody></table></div></section></main>
<script src="js/common.js"></script>
<script>
let rooms = [], notices = [];
const NEXT = { Pending: ['Acknowledged', 'Acknowledge'], Acknowledged: ['Cleaning', 'Start cleaning'], Cleaning: ['Completed', 'Mark completed'] };
function draw() {
  const l = filtered(rooms), map = Object.fromEntries(rooms.map(r => [r.roomNumber, r.status]));
  $('#rows').innerHTML = l.length ? l.map(r => `<tr><td><b>${esc(r.roomNumber)}</b></td><td>${badge(r.status)}</td><td>${esc(r.availability)}</td><td>${fmt(r.lastUpdated)}</td></tr>`).join('') : msgRow(4, 'No rooms match your search.');
  $('#nrows').innerHTML = notices.length ? notices.map(n => `<tr><td><b>${esc(n.roomNumber)}</b></td><td>${esc(n.message)}</td><td>${esc(n.createdBy)}</td><td>${fmt(n.createdAt)}</td><td>${badge(n.status)}</td>
    <td>${map[n.roomNumber] ? badge(map[n.roomNumber]) : '—'}</td><td>${NEXT[n.status] ? `<button class="btn sm primary" data-id="${n.id}" data-s="${NEXT[n.status][0]}">${NEXT[n.status][1]}</button>` : 'Done'}</td></tr>`).join('') : msgRow(7, 'No housekeeping notices.');
}
$('#nrows').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  try { await api('/notices/' + b.dataset.id, { method: 'PATCH', body: { status: b.dataset.s } }); toast('Notice updated.'); load(); } catch (x) { toast(x.message, true); }
};
async function load() {
  try { [rooms, notices] = await Promise.all([api('/rooms'), api('/notices')]); }
  catch (x) { $('#nrows').innerHTML = msgRow(7, x.message, true); return; }
  summary(rooms); draw();
}
initShell(draw); load(); setInterval(load, 15000);
</script></body></html>
