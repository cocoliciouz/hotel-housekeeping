<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Assistant</title><link rel="stylesheet" href="css/neo.css"></head>
<body data-role="Room Assistant">
<header class="top"><h1>Room Assistant</h1><button class="btn primary" id="toggle" aria-expanded="false">New Housekeeping Notice</button></header>
<main><section id="summary" class="stats"></section>
<div class="split solo" id="layout">
<section class="panel" id="notice" hidden><h2>Housekeeping Notice</h2>
<form id="nf"><label>Room number<select id="nroom" required></select></label>
<label>Notice message<textarea id="nmsg" maxlength="300" required>Guest returned the room key. Cleaning required.</textarea></label>
<label>Date and time<input id="ndt" type="datetime-local" readonly></label>
<button class="btn primary">Send Notice</button></form></section>
<section class="panel"><h2>Rooms</h2><div id="toolbar" class="bar"></div>
<div class="tw"><table><thead><tr><th>Room</th><th>Type</th><th>Status</th><th>Availability</th><th>Last Updated</th><th>Actions</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="msg">Loading rooms…</td></tr></tbody></table></div></section>
</div></main>
<script src="js/common.js"></script>
<script>
let rooms = [];
const form = $('#notice');
function stamp() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); $('#ndt').value = d.toISOString().slice(0, 16); }
function setForm(open) {
  form.hidden = !open; $('#layout').classList.toggle('solo', !open);
  $('#toggle').setAttribute('aria-expanded', open); $('#toggle').textContent = open ? 'Close Notice Form' : 'New Housekeeping Notice'; if (open) stamp();
}
$('#toggle').onclick = () => setForm(form.hidden);
function draw() {
  const l = filtered(rooms);
  $('#rows').innerHTML = l.length ? l.map(r => `<tr><td><b>${esc(r.roomNumber)}</b></td><td>${esc(r.roomType)}</td><td>${badge(r.status)}</td><td>${esc(r.availability)}</td><td>${fmt(r.lastUpdated)}</td>
    <td>${r.status === 'Occupied' ? `<button class="btn sm" data-a="vacate" data-r="${esc(r.roomNumber)}">Key returned</button>` : r.status === 'Available' ? `<button class="btn sm" data-a="occupy" data-r="${esc(r.roomNumber)}">Mark occupied</button>` : ''}
    <button class="btn sm" data-a="notice" data-r="${esc(r.roomNumber)}">Send notice</button></td></tr>`).join('') : msgRow(6, 'No rooms match your search.');
}
$('#rows').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return; const n = b.dataset.r;
  if (b.dataset.a === 'notice') { $('#nroom').value = n; setForm(true); $('#nmsg').focus(); return; }
  const body = b.dataset.a === 'occupy' ? { occupancyStatus: 'Occupied' } : { occupancyStatus: 'Vacant', housekeepingStatus: 'Dirty' };
  try { await api(`/rooms/${encodeURIComponent(n)}/status`, { method: 'PATCH', body }); toast(`Room ${n} updated.`); load(); } catch (x) { toast(x.message, true); }
};
$('#nf').onsubmit = async e => {
  e.preventDefault();
  try { await api('/notices', { method: 'POST', body: { roomNumber: $('#nroom').value, message: $('#nmsg').value } });
    toast(`Notice sent for room ${$('#nroom').value}.`); setForm(false); load(); } catch (x) { toast(x.message, true); }
};
async function load() {
  try { rooms = await api('/rooms'); } catch (x) { $('#rows').innerHTML = msgRow(6, x.message, true); return; }
  const cur = $('#nroom').value; $('#nroom').innerHTML = rooms.map(r => `<option>${esc(r.roomNumber)}</option>`).join(''); if (cur) $('#nroom').value = cur;
  summary(rooms); draw();
}
initShell(draw); load(); setInterval(load, 15000);
</script></body></html>
